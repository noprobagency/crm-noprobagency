<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NoProb · CRM · Bounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main>
  <!-- STATS BOUNCE -->
  <section>
    <div class="stats" style="grid-template-columns:repeat(4,1fr);">
      <div class="stat danger"><div class="label">Totale bounce</div><div class="value" id="b-total">—</div></div>
      <div class="stat purple"><div class="label">Da Manu</div><div class="value" id="b-manu">—</div></div>
      <div class="stat blue"><div class="label">Da Dami</div><div class="value" id="b-dami">—</div></div>
      <div class="stat warning"><div class="label">Da Claude</div><div class="value" id="b-claude">—</div></div>
    </div>
  </section>

  <!-- TABELLA BOUNCE -->
  <section>
    <h2 class="section-title">Bounce <span class="count" id="bounce-count"></span></h2>
    <div class="filters">
      <div class="filter-group" id="bf-sender">
        <span class="chip active" data-key="sender" data-value="all">Tutti</span>
        <span class="chip" data-key="sender" data-value="Manu">Manu</span>
        <span class="chip" data-key="sender" data-value="Dami">Dami</span>
        <span class="chip" data-key="sender" data-value="Claude">Claude</span>
      </div>
      <div class="filter-group" id="bf-angle">
        <span class="chip active" data-key="angle" data-value="all">Tutti angoli</span>
        <span class="chip" data-key="angle" data-value="1A">1A</span>
        <span class="chip" data-key="angle" data-value="2A">2A</span>
        <span class="chip" data-key="angle" data-value="3A">3A</span>
        <span class="chip" data-key="angle" data-value="3B">3B</span>
        <span class="chip" data-key="angle" data-value="2B">2B</span>
      </div>
    </div>
    <div id="bounce-table-wrap"></div>
    <div id="bounce-pagination"></div>
  </section>

  <!-- ARCHIVIATI -->
  <section>
    <h2 class="section-title">Archiviati <span class="count" id="arch-count"></span></h2>
    <div id="arch-table-wrap"></div>
    <div id="arch-pagination"></div>
  </section>
</main>

<script src="./js/shared.js"></script>
<script>
const STATE = {
  data: null,
  bounce: { sender: 'all', angle: 'all', page: 1 },
  arch:   { page: 1 },
};

function renderStats() {
  const all = STATE.data.bounced || [];
  document.getElementById('b-total').textContent  = all.length;
  document.getElementById('b-manu').textContent   = all.filter(b => (b.sender || b.assigned_to) === 'Manu').length;
  document.getElementById('b-dami').textContent   = all.filter(b => (b.sender || b.assigned_to) === 'Dami').length;
  document.getElementById('b-claude').textContent = all.filter(b => (b.sender || b.assigned_to) === 'Claude').length;
}

function applyBounceFilters(items) {
  let r = items;
  if (STATE.bounce.sender !== 'all') r = r.filter(b => (b.sender || b.assigned_to) === STATE.bounce.sender);
  if (STATE.bounce.angle  !== 'all') r = r.filter(b => b.angle === STATE.bounce.angle);
  return r;
}

function changeBouncePage(p) {
  STATE.bounce.page = p; renderBounces();
  document.getElementById('bounce-table-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function changeArchPage(p) {
  STATE.arch.page = p; renderArchived();
  document.getElementById('arch-table-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
window.changeBouncePage = changeBouncePage;
window.changeArchPage   = changeArchPage;

function renderBounces() {
  const wrap = document.getElementById('bounce-table-wrap');
  const pag  = document.getElementById('bounce-pagination');
  wrap.innerHTML = ''; pag.innerHTML = '';

  const all = STATE.data.bounced || [];
  const filtered = applyBounceFilters(all)
    .sort((a, b) => (b.bounce_date || '').localeCompare(a.bounce_date || ''));
  document.getElementById('bounce-count').textContent =
    `${filtered.length}${filtered.length !== all.length ? ' filtrati su ' + all.length : ''}`;

  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty">Nessun bounce</div>';
    return;
  }

  const state = paginate(filtered, STATE.bounce.page, 50);
  let html = `
    <table class="crm-table">
      <thead><tr>
        <th>Brand</th>
        <th>Email tentata</th>
        <th>Assegnato</th>
        <th>Angolo</th>
        <th>Data bounce</th>
        <th>Contatto alt.</th>
        <th>Note</th>
      </tr></thead>
      <tbody>
  `;
  for (const b of state.items) {
    const sender = (b.sender || b.assigned_to || 'Manu').toLowerCase();
    const isSkip = b.skip === true;
    const altCol = isSkip
      ? `<span style="color:var(--muted);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Escluso</span>`
      : (b.alt_contact_found
          ? `<span class="badge" style="background:#edf7da;color:#2a5a20">Trovato</span>`
          : `<span class="badge" style="background:#fde8e8;color:#8a1f1f">Da cercare</span>`);
    const skipBadge = isSkip
      ? ` <span class="badge" style="background:#fde8e8;color:#8a1f1f;font-weight:700;margin-left:6px;">SKIP</span>`
      : '';
    const brandLink = b.domain
      ? `<a href="https://${b.domain}" target="_blank" rel="noopener">${escapeHtml(b.brand || b.domain)}</a>`
      : escapeHtml(b.brand || '—');
    html += `
      <tr class="${sender}" ${isSkip ? 'style="opacity:0.5;"' : ''}>
        <td class="brand-cell">${brandLink}${skipBadge}</td>
        <td class="mono">${escapeHtml(b.email || '—')}</td>
        <td>${senderBadge(b.sender || b.assigned_to)}</td>
        <td>${angleBadge(b.angle)}</td>
        <td class="mono">${formatDateFull(b.bounce_date)}</td>
        <td>${altCol}</td>
        <td style="font-size:12px;color:var(--muted);">${escapeHtml(b.notes || '—')}</td>
      </tr>
    `;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  renderPagination(pag, state.currentPage, state.totalPages, 'changeBouncePage', state.total);
}

function renderArchived() {
  const wrap = document.getElementById('arch-table-wrap');
  const pag  = document.getElementById('arch-pagination');
  wrap.innerHTML = ''; pag.innerHTML = '';

  const all = STATE.data.no_reply || [];
  const archived = all
    .filter(p => p.status === 'archived')
    .sort((a, b) => (b.first_contact || '').localeCompare(a.first_contact || ''));
  document.getElementById('arch-count').textContent = archived.length;

  if (!archived.length) {
    wrap.innerHTML = '<div class="empty">Nessun prospect archiviato (sequenza completata G45+)</div>';
    return;
  }

  const state = paginate(archived, STATE.arch.page, 50);
  let html = `
    <table class="crm-table">
      <thead><tr>
        <th>Brand</th>
        <th>Contatto</th>
        <th>Assegnato</th>
        <th>Angolo</th>
        <th>Primo contatto</th>
        <th>Giorni totali</th>
        <th>Note</th>
      </tr></thead>
      <tbody>
  `;
  for (const p of state.items) {
    const sender = (p.sender || p.assigned_to || 'Manu').toLowerCase();
    const days = daysSince(p.first_contact);
    html += `
      <tr class="${sender}" data-pid="${p.id}">
        <td class="brand-cell">${escapeHtml(p.brand || '—')}</td>
        <td>${escapeHtml(p.contact || p.email || '—')}</td>
        <td>${senderBadge(p.sender || p.assigned_to)}</td>
        <td>${angleBadge(p.angle)}</td>
        <td class="mono">${formatDateFull(p.first_contact)}</td>
        <td><span class="days-pill red">${days}g</span></td>
        <td style="font-size:12px;color:var(--muted);">${escapeHtml(p.notes || '—')}</td>
      </tr>
    `;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  // bind row click → modal
  wrap.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => {
      const pid = tr.getAttribute('data-pid');
      const p = (STATE.data.no_reply || []).find(x => x.id === pid);
      if (p) openProspectModal(p);
    });
  });

  renderPagination(pag, state.currentPage, state.totalPages, 'changeArchPage', state.total);
}

function bindFilters() {
  document.querySelectorAll('#bf-sender .chip, #bf-angle .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.getAttribute('data-key');
      const val = chip.getAttribute('data-value');
      STATE.bounce[key] = val;
      const grp = chip.parentElement;
      grp.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      STATE.bounce.page = 1;
      renderBounces();
    });
  });
}

async function init() {
  document.getElementById('header-slot').innerHTML = buildHeader('bounced');
  try {
    STATE.data = await loadProspects();
    setTimestamp(STATE.data.meta && STATE.data.meta.last_updated);
    bindFilters();
    renderStats();
    renderBounces();
    renderArchived();
  } catch (err) {
    showError(`Errore caricamento dati: ${err.message}`);
    setTimestamp(null);
  }
}
init();
</script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NoProb · CRM · Follow-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main>
  <!-- TODAY -->
  <section>
    <h2 class="section-title">Follow-up in scadenza oggi <span class="count" id="today-count"></span></h2>
    <div id="today-list"></div>
  </section>

  <!-- NEXT 7 DAYS -->
  <section>
    <h2 class="section-title">Prossimi 7 giorni <span class="count" id="next7-count"></span></h2>
    <div id="next7-list"></div>
  </section>

  <!-- HISTORICAL SENT -->
  <section>
    <h2 class="section-title">Tutti gli invii <span class="count" id="sent-count"></span></h2>

    <div class="filters">
      <div class="filter-group" id="f-kind">
        <span class="chip active" data-key="kind" data-value="all">Tutti</span>
        <span class="chip" data-key="kind" data-value="first">Prime email</span>
        <span class="chip" data-key="kind" data-value="followup">Follow-up</span>
      </div>
      <div class="filter-group" id="f-sender">
        <span class="chip active" data-key="sender" data-value="all">Tutti mittenti</span>
        <span class="chip" data-key="sender" data-value="Manu">Manu</span>
        <span class="chip" data-key="sender" data-value="Dami">Dami</span>
        <span class="chip" data-key="sender" data-value="Claude">Claude</span>
        <span class="chip" data-key="sender" data-value="Antonio">Antonio</span>
      </div>
      <div class="filter-group" style="border-left:none;">
        <input type="date" id="sent-from" class="search-input" style="min-width:auto;" />
        <input type="date" id="sent-to"   class="search-input" style="min-width:auto;" />
        <button class="btn secondary" id="sent-reset-dates">Reset date</button>
      </div>
    </div>

    <div id="sent-list"></div>
    <div id="sent-pagination"></div>
  </section>
</main>

<script src="./js/shared.js"></script>
<script>
const STATE = {
  data: null,
  sent: { kind: 'all', sender: 'all', from: null, to: null, page: 1 },
};

// ---------- Compute todos (next-action per ogni prospect) ----------
function computeAllTodos() {
  const all = [...(STATE.data.active || []), ...(STATE.data.no_reply || [])];
  const todos = [];
  for (const p of all) {
    if (p.status === 'archived' || p.status === 'closed' || p.status === 'autoresponse') continue;
    if (p.status === 'in_conversation' || p.status === 'call_booked') {
      if (p.next_action_date) {
        todos.push({ prospect: p, action: p.next_action || 'Follow-up conversazione', date: p.next_action_date, label: null });
      }
      continue;
    }
    const next = getNextAction(p.first_contact, p.followups_sent || []);
    if (next.date && next.label) {
      todos.push({ prospect: p, action: next.action, date: next.date, label: next.label, auto: next.auto });
    }
  }
  return todos;
}

function todoCard(t) {
  const p = t.prospect;
  const sender = (p.sender || p.assigned_to || 'Manu').toLowerCase();
  const u = urgency(t.date);
  const days = daysSince(p.first_contact);

  const card = document.createElement('div');
  card.className = `fu-card ${sender}`;
  card.innerHTML = `
    <div class="fu-main">
      <div class="fu-brand-row">
        ${senderBadge(p.sender || p.assigned_to)}
        <span class="fu-brand">${escapeHtml(p.brand)}</span>
        ${angleBadge(p.angle)}
        ${t.label ? `<span class="badge" style="background:#1A1A1A;color:#fff">${t.label}</span>` : ''}
      </div>
      <div class="fu-meta">
        ${escapeHtml(p.contact || p.email || '—')} · primo contatto ${formatDate(p.first_contact)} · ${days}g dall'inizio
      </div>
    </div>
    <div class="fu-right">
      <span class="fu-due ${u}">${dueLabel(t.date)}</span>
      <span class="fu-date">${formatDate(t.date)}</span>
    </div>
  `;
  card.addEventListener('click', () => openProspectModal(p));
  return card;
}

function renderTodaySection() {
  const wrap = document.getElementById('today-list');
  wrap.innerHTML = '';
  const todos = computeAllTodos();
  const todayList = todos.filter(t => daysUntil(t.date) === 0);
  document.getElementById('today-count').textContent = todayList.length;

  if (!todayList.length) {
    wrap.innerHTML = '<div class="empty success">Nessun follow-up in scadenza oggi ✓</div>';
    return;
  }
  for (const t of todayList) wrap.appendChild(todoCard(t));
}

function renderNext7Section() {
  const wrap = document.getElementById('next7-list');
  wrap.innerHTML = '';
  const todos = computeAllTodos();
  const list = todos.filter(t => {
    const d = daysUntil(t.date);
    return d != null && d > 0 && d <= 7;
  });
  document.getElementById('next7-count').textContent = list.length;

  if (!list.length) {
    wrap.innerHTML = '<div class="empty">Nessun follow-up nei prossimi 7 giorni</div>';
    return;
  }

  // Raggruppa per data
  const groups = {};
  for (const t of list) {
    (groups[t.date] = groups[t.date] || []).push(t);
  }
  const sortedDates = Object.keys(groups).sort();
  for (const date of sortedDates) {
    const days = daysUntil(date);
    const dayLabel = days === 1 ? 'Domani' : `Tra ${days}g`;
    const g = document.createElement('div');
    g.className = 'fu-group';
    g.innerHTML = `<h3>${dayLabel} · ${formatDateFull(date)} <span class="count">${groups[date].length}</span></h3>`;
    for (const t of groups[date]) g.appendChild(todoCard(t));
    wrap.appendChild(g);
  }
}

// ---------- Sent (historical) ----------
function flattenSentEmails() {
  const all = [...(STATE.data.active || []), ...(STATE.data.no_reply || [])];
  const out = [];
  for (const p of all) {
    // Prima email
    if (p.first_contact) {
      out.push({
        prospect: p,
        date: p.first_contact,
        kind: 'first',
        type: 'first',
        sender: p.sender || p.assigned_to,
        snippet: p.first_email_snippet || (p.last_outbound_by_antonio && p.last_outbound_by_antonio.snippet) || '',
      });
    }
    // Follow-up
    for (const f of (p.followups_sent || [])) {
      out.push({
        prospect: p,
        date: f.date,
        kind: 'followup',
        type: f.type,
        sender: f.sender || p.sender || p.assigned_to,
        snippet: f.snippet || '',
      });
    }
  }
  out.sort((a, b) => b.date.localeCompare(a.date));
  return out;
}

function applySentFilters(items) {
  let r = items;
  if (STATE.sent.kind !== 'all')   r = r.filter(e => e.kind === STATE.sent.kind);
  if (STATE.sent.sender !== 'all') r = r.filter(e => e.sender === STATE.sent.sender);
  if (STATE.sent.from)             r = r.filter(e => e.date >= STATE.sent.from);
  if (STATE.sent.to)               r = r.filter(e => e.date <= STATE.sent.to);
  return r;
}

function sentCard(e) {
  const p = e.prospect;
  const sender = (e.sender || 'Manu').toLowerCase();
  const snippet = (e.snippet || '').slice(0, 140);
  const card = document.createElement('div');
  card.className = `fu-card ${sender}`;
  card.innerHTML = `
    <div class="fu-main">
      <div class="fu-brand-row">
        ${senderBadge(e.sender)}
        <span class="fu-brand">${escapeHtml(p.brand)}</span>
        <span class="badge" style="background:#1A1A1A;color:#fff">${fuTypeLabel(e.type)}</span>
        ${angleBadge(p.angle)}
      </div>
      <div class="fu-meta">${escapeHtml(p.email || '—')}</div>
      <div class="fu-snippet">"${escapeHtml(snippet)}${e.snippet && e.snippet.length > 140 ? '…' : ''}"</div>
    </div>
    <div class="fu-right">
      <span class="fu-date">${formatDateFull(e.date)}</span>
    </div>
  `;
  card.addEventListener('click', () => openProspectModal(p));
  return card;
}

function changeSentPage(p) {
  STATE.sent.page = p;
  renderSent();
  document.getElementById('sent-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderSent() {
  const wrap = document.getElementById('sent-list');
  const pag  = document.getElementById('sent-pagination');
  wrap.innerHTML = '';

  const all = flattenSentEmails();
  const filtered = applySentFilters(all);
  document.getElementById('sent-count').textContent =
    `${filtered.length}${filtered.length !== all.length ? ' filtrati su ' + all.length : ''}`;

  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty">Nessuna email coi filtri attuali</div>';
    pag.innerHTML = '';
    return;
  }

  const state = paginate(filtered, STATE.sent.page, 50);
  for (const e of state.items) wrap.appendChild(sentCard(e));
  renderPagination(pag, state.currentPage, state.totalPages, 'changeSentPage', state.total);
}

function bindFilters() {
  document.querySelectorAll('#f-kind .chip, #f-sender .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.getAttribute('data-key');
      const val = chip.getAttribute('data-value');
      STATE.sent[key] = val;
      const grp = chip.parentElement;
      grp.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      STATE.sent.page = 1;
      renderSent();
    });
  });
  document.getElementById('sent-from').addEventListener('change', e => {
    STATE.sent.from = e.target.value || null; STATE.sent.page = 1; renderSent();
  });
  document.getElementById('sent-to').addEventListener('change', e => {
    STATE.sent.to = e.target.value || null; STATE.sent.page = 1; renderSent();
  });
  document.getElementById('sent-reset-dates').addEventListener('click', () => {
    STATE.sent.from = null; STATE.sent.to = null; STATE.sent.page = 1;
    document.getElementById('sent-from').value = '';
    document.getElementById('sent-to').value = '';
    renderSent();
  });
}

async function init() {
  document.getElementById('header-slot').innerHTML = buildHeader('followups');
  try {
    STATE.data = await loadProspects();
    setTimestamp(STATE.data.meta && STATE.data.meta.last_updated);
    bindFilters();
    renderTodaySection();
    renderNext7Section();
    renderSent();
  } catch (err) {
    showError(`Errore caricamento dati: ${err.message}`);
    setTimestamp(null);
  }
}
init();
</script>
</body>
</html>

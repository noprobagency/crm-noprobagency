<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NoProb · CRM · Follow-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main>
  <!-- DA FARE -->
  <section>
    <h2 class="section-title">Da fare <span class="count" id="todo-count"></span></h2>
    <div id="todo-groups"></div>
  </section>

  <!-- FOLLOW-UP INVIATI -->
  <section>
    <h2 class="section-title">Follow-up già inviati <span class="count" id="sent-count"></span></h2>
    <div class="filters">
      <div class="filter-group" id="sent-sender-filters">
        <span class="chip active" data-key="sender" data-value="all">Tutti</span>
        <span class="chip" data-key="sender" data-value="Manu">Manu</span>
        <span class="chip" data-key="sender" data-value="Dami">Dami</span>
        <span class="chip" data-key="sender" data-value="Claude">Claude</span>
        <span class="chip" data-key="sender" data-value="Antonio">Antonio</span>
      </div>
      <div class="filter-group" id="sent-type-filters">
        <span class="chip active" data-key="type" data-value="all">Tutti tipi</span>
        <span class="chip" data-key="type" data-value="email_day10">Email gg10</span>
        <span class="chip" data-key="type" data-value="email_day14">Email gg14</span>
        <span class="chip" data-key="type" data-value="dm_linkedin">DM LinkedIn</span>
        <span class="chip" data-key="type" data-value="inmail">InMail</span>
        <span class="chip" data-key="type" data-value="manual">Manuale</span>
      </div>
      <div class="filter-group" style="border-left:none;">
        <input type="date" id="sent-from" class="search-input" style="min-width:auto;" />
        <input type="date" id="sent-to"   class="search-input" style="min-width:auto;" />
        <button class="btn secondary" id="sent-reset">Reset date</button>
      </div>
    </div>
    <div id="sent-table"></div>
    <div id="sent-pagination"></div>
  </section>

  <!-- FORECAST 14gg -->
  <section>
    <h2 class="section-title">Prossime azioni — 14 giorni</h2>
    <div class="forecast" id="forecast"></div>
  </section>
</main>

<script src="./js/shared.js"></script>
<script>
const STATE = {
  data: null,
  sent: { sender: 'all', type: 'all', from: null, to: null, page: 1, perPage: 50 }
};

// ---------- Da fare ----------
function computeTodos() {
  const all = [...(STATE.data.active || []), ...(STATE.data.no_reply || [])];
  const todos = [];
  for (const p of all) {
    if (p.status === 'archived' || p.status === 'closed') continue;
    if (p.status === 'in_conversation' || p.status === 'call_booked') {
      // per gli active usiamo next_followup_due / next_action così com'è
      if (p.next_followup_due) {
        todos.push({
          prospect: p,
          action: p.next_action || 'Follow-up conversazione',
          date: p.next_followup_due,
          manual: true,
          type: 'manual',
        });
      }
      continue;
    }
    const next = getNextAction(p.first_contact, p.followups_sent || []);
    if (next.action && next.date && !next.archived) {
      todos.push({ prospect: p, action: next.action, date: next.date, manual: next.manual, type: next.type });
    }
  }
  todos.sort((a, b) => (daysUntil(a.date) ?? 999) - (daysUntil(b.date) ?? 999));
  return todos;
}

function renderTodos() {
  const wrap = document.getElementById('todo-groups');
  clear(wrap);

  const todos = computeTodos();
  document.getElementById('todo-count').textContent = todos.length;

  const groups = {
    'Oggi':           [],
    'Domani':         [],
    'Questa settimana': [],
    'Oltre':          [],
    'Scaduti':        [],
  };
  for (const t of todos) {
    const d = daysUntil(t.date);
    if (d == null) continue;
    if (d < 0) groups['Scaduti'].push(t);
    else if (d === 0) groups['Oggi'].push(t);
    else if (d === 1) groups['Domani'].push(t);
    else if (d <= 7) groups['Questa settimana'].push(t);
    else groups['Oltre'].push(t);
  }

  let any = false;
  for (const [name, list] of Object.entries(groups)) {
    if (!list.length) continue;
    any = true;
    const g = el('div', { class: 'fu-group' });
    g.appendChild(el('h3', {}, name, el('span', { class: 'count' }, `${list.length}`)));
    for (const t of list) {
      g.appendChild(renderTodoRow(t));
    }
    wrap.appendChild(g);
  }
  if (!any) wrap.appendChild(el('div', { class: 'empty' }, 'Nessuna azione pianificata'));
}

function renderTodoRow(t) {
  const p = t.prospect;
  const sender = (p.sender || p.assigned_to || 'Manu').toLowerCase();
  const u = urgency(t.date);
  const tag = t.manual
    ? el('span', { class: 'tag manual' }, 'Manuale')
    : el('span', { class: 'tag cowork' }, 'Cowork auto');

  const row = el('div', { class: `fu-row sender-${sender}` },
    el('div', {},
      senderBadge(p.sender || p.assigned_to),
      ' ',
      angleBadge(p.angle)
    ),
    el('div', {},
      el('strong', {}, p.brand),
      ' · ',
      p.contact || p.email || '—',
      el('br'),
      el('span', { class: 'fu-action' }, t.action),
      ' ',
      tag
    ),
    el('div', { class: `fu-due ${u}` }, dueLabel(t.date)),
    el('div', { class: 'mono', style: 'color:var(--muted);font-size:11px;' }, fmtDateIT(t.date)),
  );
  row.style.cursor = 'pointer';
  row.addEventListener('click', () => openModal(p.brand, buildProspectModal(p)));
  return row;
}

// ---------- Sent followups ----------
function flattenSent() {
  const all = [...(STATE.data.active || []), ...(STATE.data.no_reply || [])];
  const out = [];
  for (const p of all) {
    for (const f of (p.followups_sent || [])) {
      out.push({
        date: f.date,
        type: f.type,
        sender: f.sender,
        snippet: f.snippet,
        prospect: p,
      });
    }
  }
  out.sort((a, b) => b.date.localeCompare(a.date));
  return out;
}

function applySentFilters(items) {
  let r = items;
  if (STATE.sent.sender !== 'all') r = r.filter(f => f.sender === STATE.sent.sender);
  if (STATE.sent.type !== 'all')   r = r.filter(f => f.type === STATE.sent.type);
  if (STATE.sent.from) r = r.filter(f => f.date >= STATE.sent.from);
  if (STATE.sent.to)   r = r.filter(f => f.date <= STATE.sent.to);
  return r;
}

function renderSent() {
  const wrap = document.getElementById('sent-table');
  const pagWrap = document.getElementById('sent-pagination');
  clear(wrap); clear(pagWrap);

  const all = flattenSent();
  const filtered = applySentFilters(all);
  document.getElementById('sent-count').textContent =
    `${filtered.length}${filtered.length !== all.length ? ' filtrati' : ''}`;

  if (!filtered.length) {
    wrap.appendChild(el('div', { class: 'empty' }, 'Nessun follow-up inviato'));
    return;
  }

  const state = paginate(filtered, STATE.sent.page, STATE.sent.perPage);

  const table = el('table', { class: 'crm-table' });
  table.appendChild(el('thead', {}, el('tr', {},
    el('th', {}, 'Data'),
    el('th', {}, 'Brand'),
    el('th', {}, 'Contatto'),
    el('th', {}, 'Tipo'),
    el('th', {}, 'Mittente'),
    el('th', {}, 'Snippet'),
  )));
  const tbody = el('tbody');
  for (const f of state.slice) {
    const sender = (f.sender || 'Manu').toLowerCase();
    const tr = el('tr', { class: `sender-${sender}` },
      el('td', { class: 'mono' }, fmtDateIT(f.date)),
      el('td', { class: 'brand-cell' }, f.prospect.brand),
      el('td', {}, f.prospect.contact || f.prospect.email || '—'),
      el('td', {}, el('span', { class: 'tag manual' }, f.type)),
      el('td', {}, senderBadge(f.sender)),
      el('td', { style: 'max-width:380px;color:var(--muted);font-size:12px;font-style:italic;' }, f.snippet || ''),
    );
    tr.addEventListener('click', () => openModal(f.prospect.brand, buildProspectModal(f.prospect)));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);

  pagWrap.appendChild(renderPagination(state, p => {
    STATE.sent.page = p;
    renderSent();
    document.getElementById('sent-table').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
}

function bindSentFilters() {
  document.querySelectorAll('#sent-sender-filters .chip, #sent-type-filters .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.getAttribute('data-key');
      const val = chip.getAttribute('data-value');
      STATE.sent[key] = val;
      const grp = chip.parentElement;
      grp.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      STATE.sent.page = 1;
      renderSent();
    });
  });
  ['sent-from', 'sent-to'].forEach(id => {
    document.getElementById(id).addEventListener('change', e => {
      STATE.sent[id === 'sent-from' ? 'from' : 'to'] = e.target.value || null;
      STATE.sent.page = 1;
      renderSent();
    });
  });
  document.getElementById('sent-reset').addEventListener('click', () => {
    STATE.sent.from = null; STATE.sent.to = null; STATE.sent.page = 1;
    document.getElementById('sent-from').value = '';
    document.getElementById('sent-to').value = '';
    renderSent();
  });
}

// ---------- Forecast ----------
function renderForecast() {
  const wrap = document.getElementById('forecast');
  clear(wrap);

  const todos = computeTodos();
  const t = today();
  for (let i = 0; i < 14; i++) {
    const d = new Date(t); d.setDate(d.getDate() + i);
    const iso = d.toISOString().split('T')[0];
    const onDay = todos.filter(x => x.date === iso);
    if (!onDay.length) continue;

    const dayCol = el('div', { class: 'day-col' },
      el('strong', {}, fmtDateShort(iso)),
      i === 0 ? 'Oggi' : (i === 1 ? 'Domani' : `+${i}g`)
    );
    const events = el('div', { class: 'day-events' });
    for (const ev of onDay) {
      events.appendChild(el('div', { class: 'event' },
        senderBadge(ev.prospect.sender || ev.prospect.assigned_to),
        ' ',
        el('strong', {}, ev.prospect.brand),
        el('span', { class: 'e-action' }, ev.action)
      ));
    }
    wrap.appendChild(dayCol);
    wrap.appendChild(events);
  }
  if (!wrap.children.length) {
    wrap.appendChild(el('div', { class: 'empty' }, 'Nessuna azione pianificata nei prossimi 14 giorni'));
  }
}

async function init() {
  document.getElementById('header-slot').appendChild(buildHeader('followups'));
  try {
    STATE.data = await loadProspects();
    setTimestamp(STATE.data.meta && STATE.data.meta.last_updated);
    bindSentFilters();
    renderTodos();
    renderSent();
    renderForecast();
  } catch (err) {
    showError(`Errore caricamento dati: ${err.message}`);
    setTimestamp(null);
  }
}
init();
</script>
</body>
</html>

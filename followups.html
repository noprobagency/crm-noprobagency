<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NoProb · CRM · Follow-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main>
  <!-- SCADUTI -->
  <section class="scaduti-section" id="scaduti-section" style="display:none;">
    <h2 class="section-title">⚠ Follow-up scaduti — da inviare <span class="count" id="scaduti-count"></span></h2>
    <div id="scaduti-list"></div>
  </section>

  <!-- TODAY -->
  <section>
    <h2 class="section-title">Follow-up in scadenza oggi <span class="count" id="today-count"></span></h2>
    <div id="today-list"></div>
  </section>

  <!-- NEXT 7 DAYS -->
  <section>
    <h2 class="section-title">Prossimi 7 giorni <span class="count" id="next7-count"></span></h2>
    <div id="next7-list"></div>
  </section>

  <!-- HISTORICAL SENT -->
  <section>
    <h2 class="section-title">Tutti gli invii <span class="count" id="sent-count"></span></h2>

    <div class="filters">
      <div class="filter-group" id="f-kind">
        <span class="chip active" data-key="kind" data-value="all">Tutti</span>
        <span class="chip" data-key="kind" data-value="first">Prime email</span>
        <span class="chip" data-key="kind" data-value="followup">Follow-up</span>
      </div>
      <div class="filter-group" id="f-sender">
        <span class="chip active" data-key="sender" data-value="all">Tutti mittenti</span>
        <span class="chip" data-key="sender" data-value="Manu">Manu</span>
        <span class="chip" data-key="sender" data-value="Dami">Dami</span>
        <span class="chip" data-key="sender" data-value="Claude">Claude</span>
        <span class="chip" data-key="sender" data-value="Antonio">Antonio</span>
      </div>
      <div class="filter-group" style="border-left:none;">
        <input type="date" id="sent-from" class="search-input" style="min-width:auto;" />
        <input type="date" id="sent-to"   class="search-input" style="min-width:auto;" />
        <button class="btn secondary" id="sent-reset-dates">Reset date</button>
      </div>
    </div>

    <div id="sent-table-wrap"></div>
    <div id="sent-pagination"></div>
  </section>
</main>

<script src="./js/shared.js"></script>
<script>
const STATE = {
  data: null,
  sent: { kind: 'all', sender: 'all', from: null, to: null, page: 1 },
};

// ---------- Resolve next action ----------
// Priorità: 1) prospect.next_action_date diretto dal JSON (Routine OOO/redirect/CS),
//           2) fallback su getNextAction(p) che usa scheduled_timeline.
// I prospect 'in_conversation' / 'call_booked' / 'closed' / 'archived' / 'bounced'
// sono SEMPRE esclusi: hanno gestione separata.
const HARD_EXCLUDED = ['in_conversation', 'call_booked', 'closed', 'archived', 'bounced'];

function resolveNextAction(p) {
  // Custom override dal JSON (autoresponse/OOO/redirect/CS)
  if (p.next_action_date) {
    const todayIso = todayRomeIso();
    return {
      action: p.next_action || '—',
      date: p.next_action_date,
      label: null,
      overdue: p.next_action_date < todayIso,
      isCustom: true,
    };
  }
  // Sequenza SOP standard
  return getNextAction(p);
}

function getActionBadge(p, fallbackLabel) {
  // 1. redirect_to è il segnale più affidabile
  if (p.redirect_to) {
    return { label: 'REDIRECT', bg: '#fff3e0', color: '#c45c00' };
  }

  const action = (p.next_action || '').toLowerCase();
  const notes = (p.notes || '').toLowerCase();

  // 2. Action text esplicito (override per qualsiasi status)
  if (/redirect|inviare a |prima email a/.test(action)) {
    return { label: 'REDIRECT', bg: '#fff3e0', color: '#c45c00' };
  }
  if (/rientro|al rientro|ooo/.test(action)) {
    return { label: 'OOO', bg: '#fff3e0', color: '#8a4a00' };
  }
  if (/manualmente|classificare|verifica/.test(action)) {
    return { label: '⚠ DA VERIFICARE', bg: '#fde8e8', color: '#8a1f1f' };
  }

  // 3. Status autoresponse → guarda notes per sub-classification
  if (p.status === 'autoresponse') {
    if (/ooo|rientro|fuori ufficio|out of office|\bback\b/.test(notes)) {
      return { label: 'OOO', bg: '#fff3e0', color: '#8a4a00' };
    }
    if (/no-reply|noreply|contatto diretto/.test(notes)) {
      return { label: 'NO-REPLY', bg: '#f0f0f0', color: '#555' };
    }
    if (/cs |ticket|customer service|zendesk/.test(notes)) {
      return { label: 'CS', bg: '#f0f0f0', color: '#555' };
    }
    if (/non lavor|no longer|please contact|si prega di contattare/.test(notes)) {
      return { label: 'REDIRECT', bg: '#fff3e0', color: '#c45c00' };
    }
    return { label: 'AUTO', bg: '#f0f0f0', color: '#555' };
  }

  // 4. CS/attendere generic
  if (/cs |ticket|attendere/.test(action)) {
    return { label: 'CS', bg: '#f0f0f0', color: '#555' };
  }

  // 5. Fallback Follow-up standard
  if (fallbackLabel === 'FU 1') return { label: 'FU 1', bg: '#e6eef8', color: '#1e4080' };
  if (fallbackLabel === 'FU 2') return { label: 'FU 2', bg: '#e6eef8', color: '#1e4080' };
  if (fallbackLabel === 'FU 3') return { label: 'FU 3', bg: '#e6eef8', color: '#1e4080' };
  if (fallbackLabel === 'OUT') return { label: 'OUT', bg: '#fde8e8', color: '#8a1f1f' };
  return { label: 'AZIONE', bg: '#f0f0f0', color: '#555' };
}

// Priority: REDIRECT(1) > OOO(2) > overdue(3) > FU(4) > CS(5) > altro(6)
function actionPriority(p, t) {
  if (p.redirect_to) return 1;
  const action = (p.next_action || '').toLowerCase();
  if (/rientro|ooo/.test(action)) return 2;
  if (t.overdue) return 3;
  if (/fu /i.test(t.label || '')) return 4;
  if (/cs|ticket|attendere/.test(action)) return 5;
  return 6;
}

function computeAllTodos() {
  const all = [...(STATE.data.active || []), ...(STATE.data.no_reply || [])];
  const todos = [];
  for (const p of all) {
    if (HARD_EXCLUDED.includes(p.status)) continue;
    const next = resolveNextAction(p);
    if (!next.date) continue;
    todos.push({
      prospect: p,
      action: next.action,
      date: next.date,
      label: next.label,
      overdue: next.overdue,
      isCustom: next.isCustom || false,
    });
  }
  return todos;
}

function todoCard(t, opts = {}) {
  const p = t.prospect;
  const sender = (p.sender || p.assigned_to || 'Manu').toLowerCase();
  const u = urgency(t.date);
  const days = daysSince(p.first_contact);
  const overdueDays = t.overdue ? Math.abs(daysUntil(t.date)) : 0;
  const badge = getActionBadge(p, t.label);

  const card = document.createElement('div');
  card.className = `fu-card ${sender}${opts.scaduto ? ' scaduto-tag' : ''}`;
  card.innerHTML = `
    <div class="fu-main">
      <div class="fu-brand-row">
        ${senderBadge(p.sender || p.assigned_to)}
        <span class="fu-brand">${escapeHtml(p.brand)}</span>
        ${angleBadge(p.angle)}
        <span class="badge" style="background:${badge.bg};color:${badge.color};font-weight:700">${badge.label}</span>
        ${opts.scaduto ? `<span class="scaduto-pill">SCADUTO ${overdueDays}g</span>` : ''}
      </div>
      <div class="fu-meta">
        ${escapeHtml(p.contact || p.email || '—')} · primo contatto ${formatDate(p.first_contact)} (${dayOfWeek(p.first_contact)}) · ${days}g dall'inizio
      </div>
      <div class="fu-action-text" style="margin-top:6px;font-size:13px;color:var(--black);">
        → ${escapeHtml(t.action)}
      </div>
      ${p.redirect_to ? `
        <div class="fu-redirect" style="margin-top:4px;font-size:12px;color:#c45c00;font-family:var(--font-mono);">
          → <a href="mailto:${escapeHtml(p.redirect_to)}" onclick="event.stopPropagation()">${escapeHtml(p.redirect_to)}</a>
        </div>
      ` : ''}
    </div>
    <div class="fu-right">
      <span class="fu-due ${u}">${dueLabel(t.date)}</span>
      <span class="fu-date">${dayOfWeek(t.date)} ${formatDate(t.date)}</span>
    </div>
  `;
  card.addEventListener('click', () => openProspectModal(p));
  return card;
}

function renderScaduti() {
  const wrap = document.getElementById('scaduti-list');
  wrap.innerHTML = '';
  const todos = computeAllTodos();
  const list = todos.filter(t => t.overdue);
  document.getElementById('scaduti-count').textContent = list.length;

  if (!list.length) {
    document.getElementById('scaduti-section').style.display = 'none';
    return;
  }
  document.getElementById('scaduti-section').style.display = 'block';
  // Ordina per priorità + data più vecchia
  list.sort((a, b) => {
    const pa = actionPriority(a.prospect, a);
    const pb = actionPriority(b.prospect, b);
    if (pa !== pb) return pa - pb;
    return a.date.localeCompare(b.date);
  });
  for (const t of list) wrap.appendChild(todoCard(t, { scaduto: true }));
}

function renderTodaySection() {
  const wrap = document.getElementById('today-list');
  wrap.innerHTML = '';
  const todos = computeAllTodos();
  const list = todos.filter(t => daysUntil(t.date) === 0);
  document.getElementById('today-count').textContent = list.length;

  if (!list.length) {
    wrap.innerHTML = '<div class="empty success">Nessun follow-up in scadenza oggi ✓</div>';
    return;
  }
  // Ordina per priorità (REDIRECT > OOO > overdue > FU > CS > altro)
  list.sort((a, b) => actionPriority(a.prospect, a) - actionPriority(b.prospect, b));
  for (const t of list) wrap.appendChild(todoCard(t));
}

function renderNext7Section() {
  const wrap = document.getElementById('next7-list');
  wrap.innerHTML = '';
  const todos = computeAllTodos();
  const list = todos.filter(t => {
    const d = daysUntil(t.date);
    return d != null && d > 0 && d <= 7;
  });
  document.getElementById('next7-count').textContent = list.length;

  if (!list.length) {
    wrap.innerHTML = '<div class="empty">Nessun follow-up nei prossimi 7 giorni</div>';
    return;
  }

  const groups = {};
  for (const t of list) {
    (groups[t.date] = groups[t.date] || []).push(t);
  }
  const sortedDates = Object.keys(groups).sort();
  for (const date of sortedDates) {
    const days = daysUntil(date);
    const dayLabel = days === 1 ? 'Domani' : `Tra ${days}g`;
    const g = document.createElement('div');
    g.className = 'fu-group';
    g.innerHTML = `<h3>${dayLabel} · ${dayOfWeek(date)} ${formatDateFull(date)} <span class="count">${groups[date].length}</span></h3>`;
    // Ordina per priorità all'interno della stessa data
    groups[date].sort((a, b) => actionPriority(a.prospect, a) - actionPriority(b.prospect, b));
    for (const t of groups[date]) g.appendChild(todoCard(t));
    wrap.appendChild(g);
  }
}

// ---------- Sent (historical) ----------
function flattenSentEmails() {
  const all = [...(STATE.data.active || []), ...(STATE.data.no_reply || [])];
  const out = [];
  for (const p of all) {
    if (p.first_contact) {
      out.push({
        prospect: p,
        date: p.first_contact,
        kind: 'first',
        type: 'first',
        sender: p.sender || p.assigned_to,
        subject: p.subject_email || '',
        snippet: p.first_email_snippet || (p.last_outbound_by_antonio && p.last_outbound_by_antonio.snippet) || '',
      });
    }
    for (const f of (p.followups_sent || [])) {
      if (!f.date) continue;  // skip entries senza data
      out.push({
        prospect: p,
        date: f.date,
        kind: 'followup',
        type: f.type,
        sender: f.sender || p.sender || p.assigned_to,
        subject: p.subject_email || '',
        snippet: f.snippet || '',
      });
    }
  }
  // Sort DESC robusto: entries senza data vanno in fondo
  out.sort((a, b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return b.date.localeCompare(a.date);
  });
  return out;
}

function applySentFilters(items) {
  let r = items;
  if (STATE.sent.kind !== 'all')   r = r.filter(e => e.kind === STATE.sent.kind);
  if (STATE.sent.sender !== 'all') r = r.filter(e => e.sender === STATE.sent.sender);
  if (STATE.sent.from)             r = r.filter(e => e.date >= STATE.sent.from);
  if (STATE.sent.to)               r = r.filter(e => e.date <= STATE.sent.to);
  return r;
}

function changeSentPage(p) {
  STATE.sent.page = p;
  renderSent();
  document.getElementById('sent-table-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
window.changeSentPage = changeSentPage;

function renderSent() {
  const wrap = document.getElementById('sent-table-wrap');
  const pag  = document.getElementById('sent-pagination');
  wrap.innerHTML = ''; pag.innerHTML = '';

  const all = flattenSentEmails();
  const filtered = applySentFilters(all);
  document.getElementById('sent-count').textContent =
    `${filtered.length}${filtered.length !== all.length ? ' filtrati su ' + all.length : ''}`;

  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty">Nessuna email coi filtri attuali</div>';
    return;
  }

  const state = paginate(filtered, STATE.sent.page, 50);

  let html = `
    <table class="crm-table">
      <thead><tr>
        <th>Data</th>
        <th>Giorno</th>
        <th>Brand</th>
        <th>Oggetto</th>
        <th>Email</th>
        <th>Tipo</th>
        <th>Mittente</th>
        <th>Snippet</th>
      </tr></thead>
      <tbody>
  `;
  for (const e of state.items) {
    const sender = (e.sender || 'Manu').toLowerCase();
    const dow = dayOfWeek(e.date);
    const isWeekend = dow === 'Sab' || dow === 'Dom';
    const dowStyle = isWeekend ? 'color:var(--danger);font-weight:700;' : '';
    const snippet = (e.snippet || '').slice(0, 140);
    const subj = e.subject || '';
    const subjShort = subj.length > 35 ? subj.slice(0, 35) + '…' : subj;
    html += `
      <tr class="${sender}" data-pid="${e.prospect.id}">
        <td class="mono">${formatDateFull(e.date)}</td>
        <td class="mono" style="${dowStyle}">${dow}</td>
        <td class="brand-cell">${escapeHtml(e.prospect.brand)}</td>
        <td class="subject-cell" title="${escapeHtml(subj)}">${escapeHtml(subjShort) || '<span style="color:var(--muted);">—</span>'}</td>
        <td>${escapeHtml(e.prospect.email || '—')}</td>
        <td>${statusBadge('contacted').replace('Contattato', fuTypeLabel(e.type))}</td>
        <td>${senderBadge(e.sender)}</td>
        <td style="font-size:12px;color:var(--muted);font-style:italic;max-width:300px;">"${escapeHtml(snippet)}${e.snippet && e.snippet.length > 140 ? '…' : ''}"</td>
      </tr>
    `;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => {
      const pid = tr.getAttribute('data-pid');
      const p = [...(STATE.data.active || []), ...(STATE.data.no_reply || [])].find(x => x.id === pid);
      if (p) openProspectModal(p);
    });
  });
  renderPagination(pag, state.currentPage, state.totalPages, 'changeSentPage', state.total, 50);
}

function bindFilters() {
  document.querySelectorAll('#f-kind .chip, #f-sender .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.getAttribute('data-key');
      const val = chip.getAttribute('data-value');
      STATE.sent[key] = val;
      const grp = chip.parentElement;
      grp.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      STATE.sent.page = 1;
      renderSent();
    });
  });
  document.getElementById('sent-from').addEventListener('change', e => {
    STATE.sent.from = e.target.value || null; STATE.sent.page = 1; renderSent();
  });
  document.getElementById('sent-to').addEventListener('change', e => {
    STATE.sent.to = e.target.value || null; STATE.sent.page = 1; renderSent();
  });
  document.getElementById('sent-reset-dates').addEventListener('click', () => {
    STATE.sent.from = null; STATE.sent.to = null; STATE.sent.page = 1;
    document.getElementById('sent-from').value = '';
    document.getElementById('sent-to').value = '';
    renderSent();
  });
}

async function init() {
  document.getElementById('header-slot').innerHTML = buildHeader('followups');
  try {
    STATE.data = await loadProspects();
    setTimestamp(STATE.data.meta && STATE.data.meta.last_updated);
    bindFilters();
    renderScaduti();
    renderTodaySection();
    renderNext7Section();
    renderSent();
  } catch (err) {
    showError(`Errore caricamento dati: ${err.message}`);
    setTimestamp(null);
  }
}
init();
</script>
</body>
</html>

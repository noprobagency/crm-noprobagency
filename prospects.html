<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NoProb · CRM · Prospect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main>
  <section>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px;">
      <h2 class="section-title" style="border:none;margin:0;padding:0;">Prospect <span class="count" id="count"></span></h2>
      <div class="view-toggle">
        <button id="view-contact" class="active">👤 Per contatto</button>
        <button id="view-company">🏢 Per azienda</button>
      </div>
    </div>

    <!-- ROW 1: search + sender -->
    <div class="filters">
      <div class="filter-group" style="border-left:none;">
        <input type="search" id="f-search" class="search-input" placeholder="🔍  Cerca brand, contatto, email, dominio…" />
      </div>
      <div class="filter-group" id="f-sender">
        <span class="chip active" data-key="sender" data-value="all">Tutti</span>
        <span class="chip" data-key="sender" data-value="Manu">Manu</span>
        <span class="chip" data-key="sender" data-value="Dami">Dami</span>
        <span class="chip" data-key="sender" data-value="Claude">Claude</span>
        <span class="chip" data-key="sender" data-value="Antonio">Antonio</span>
      </div>
    </div>

    <!-- ROW 2: angle + status + dates -->
    <div class="filters" style="margin-top:6px;">
      <div class="filter-group" id="f-angle">
        <span class="chip active" data-key="angle" data-value="all">Tutti angoli</span>
        <span class="chip" data-key="angle" data-value="1A">1A</span>
        <span class="chip" data-key="angle" data-value="2A">2A</span>
        <span class="chip" data-key="angle" data-value="3A">3A</span>
        <span class="chip" data-key="angle" data-value="3B">3B</span>
        <span class="chip" data-key="angle" data-value="2B">2B</span>
      </div>
      <div class="filter-group">
        <select id="f-status" class="search-input" style="min-width:auto;">
          <option value="all">Tutti status</option>
          <option value="contacted">Contattato</option>
          <option value="follow_up_1_sent">FU 1 inviato</option>
          <option value="follow_up_2_sent">FU 2 inviato</option>
          <option value="follow_up_3_sent">FU 3 inviato</option>
          <option value="in_conversation">In conversazione</option>
          <option value="autoresponse">Autoresponse</option>
          <option value="archived">Archiviato</option>
          <option value="bounced">Bounce</option>
        </select>
      </div>
      <div class="filter-group">
        <label style="font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Dal</label>
        <input type="date" id="f-from" class="search-input" style="min-width:auto;" />
        <label style="font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Al</label>
        <input type="date" id="f-to" class="search-input" style="min-width:auto;" />
      </div>
      <div class="filter-group">
        <span id="f-active-badge" style="display:none;" class="range-active-badge"></span>
        <button class="btn secondary" id="f-reset">Resetta tutto</button>
      </div>
    </div>

    <div id="table-wrap"></div>
    <div id="pagination"></div>
  </section>
</main>

<script src="./js/shared.js"></script>
<script>
const STATE = {
  all: [],
  meta: null,
  view: 'contact',  // 'contact' | 'company'
  filters: { sender: 'all', angle: 'all', status: 'all', search: '', from: null, to: null },
  sort: { col: 'first_contact', dir: 'desc' },
  page: 1,
  perPage: 50,
};

function activeFiltersCount() {
  let n = 0;
  for (const k of ['sender','angle','status']) if (STATE.filters[k] !== 'all') n++;
  if (STATE.filters.search) n++;
  if (STATE.filters.from) n++;
  if (STATE.filters.to) n++;
  return n;
}

function applyFilters(items) {
  let r = items;
  const f = STATE.filters;
  if (f.sender !== 'all') r = r.filter(p => (p.sender || p.assigned_to) === f.sender);
  if (f.angle  !== 'all') r = r.filter(p => p.angle === f.angle);
  if (f.status !== 'all') r = r.filter(p => p.status === f.status);
  if (f.from) r = r.filter(p => p.first_contact && p.first_contact >= f.from);
  if (f.to)   r = r.filter(p => p.first_contact && p.first_contact <= f.to);
  if (f.search) {
    const q = f.search.toLowerCase();
    r = r.filter(p =>
      (p.brand   || '').toLowerCase().includes(q) ||
      (p.contact || '').toLowerCase().includes(q) ||
      (p.email   || '').toLowerCase().includes(q) ||
      (p.domain  || '').toLowerCase().includes(q)
    );
  }
  return r;
}

function applySort(items, sortCfg) {
  const { col, dir } = sortCfg;
  const sign = dir === 'asc' ? 1 : -1;
  const byCol = {
    brand:            p => (p.brand || '').toLowerCase(),
    first_contact:    p => p.first_contact || '',
    days:             p => daysSince(p.first_contact),
    next_action:      p => p.next_action || '',
    next_action_date: p => p.next_action_date || '9999-12-31',
    contacts_count:   p => p.contacts_count || 0,
    replies_count:    p => p.replies_count || 0,
  };
  const fn = byCol[col] || byCol.first_contact;
  return [...items].sort((a, b) => {
    const va = fn(a); const vb = fn(b);
    if (va < vb) return -1 * sign;
    if (va > vb) return 1 * sign;
    return 0;
  });
}

function changeProspectsPage(p) {
  STATE.page = p;
  render();
  document.getElementById('table-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function setSort(col) {
  if (STATE.sort.col === col) {
    STATE.sort.dir = STATE.sort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    STATE.sort.col = col;
    STATE.sort.dir = 'asc';
  }
  STATE.page = 1;
  render();
}
window.setSort = setSort;
window.changeProspectsPage = changeProspectsPage;

function arrowFor(col) {
  if (STATE.sort.col !== col) return '<span class="arrow">↕</span>';
  return STATE.sort.dir === 'asc' ? '<span class="arrow">↑</span>' : '<span class="arrow">↓</span>';
}

// ---------- Vista per contatto ----------
function renderContactView(filtered) {
  const wrap = document.getElementById('table-wrap');
  const pag  = document.getElementById('pagination');

  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty">Nessun prospect coi filtri attuali</div>';
    pag.innerHTML = '';
    return;
  }
  const sorted = applySort(filtered, STATE.sort);
  const state = paginate(sorted, STATE.page, STATE.perPage);

  let html = `
    <table class="crm-table">
      <thead><tr>
        <th class="sortable ${STATE.sort.col === 'brand' ? 'sorted' : ''}" onclick="setSort('brand')">Brand ${arrowFor('brand')}</th>
        <th>Contatto</th>
        <th>Oggetto</th>
        <th>Assegnato</th>
        <th>Angolo</th>
        <th class="sortable ${STATE.sort.col === 'first_contact' ? 'sorted' : ''}" onclick="setSort('first_contact')">Primo contatto ${arrowFor('first_contact')}</th>
        <th class="sortable ${STATE.sort.col === 'days' ? 'sorted' : ''}" onclick="setSort('days')">Giorni ${arrowFor('days')}</th>
        <th>Status</th>
        <th class="sortable ${STATE.sort.col === 'next_action' ? 'sorted' : ''}" onclick="setSort('next_action')">Prossima email ${arrowFor('next_action')}</th>
        <th class="sortable ${STATE.sort.col === 'next_action_date' ? 'sorted' : ''}" onclick="setSort('next_action_date')">Scadenza ${arrowFor('next_action_date')}</th>
      </tr></thead>
      <tbody>
  `;
  for (const p of state.items) {
    const sender = (p.sender || p.assigned_to || 'Manu').toLowerCase();
    const days = daysSince(p.first_contact);
    let daysClass = 'green';
    if (days >= 30)      daysClass = 'red';
    else if (days >= 10) daysClass = 'yellow';
    const due = p.next_action_date;
    const u = urgency(due);
    const dueClass = u === 'urgent' ? 'due-urgent' : (u === 'soon' ? 'due-soon' : '');

    const isSkip = p.skip === true;
    const brandLink = p.domain
      ? `<a href="https://${p.domain}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(p.brand || p.domain)}</a>`
      : escapeHtml(p.brand || '—');
    const skipBadge = isSkip
      ? ` <span class="badge" style="background:#fde8e8;color:#8a1f1f;font-weight:700;margin-left:6px;">SKIP</span>`
      : '';

    const subj = p.subject_email || '';
    const subjShort = subj.length > 40 ? subj.slice(0, 40) + '…' : subj;

    html += `
      <tr class="${sender}" data-pid="${p.id}" ${isSkip ? 'style="opacity:0.5;"' : ''}>
        <td class="brand-cell">${brandLink}${skipBadge}</td>
        <td>${escapeHtml(p.contact || p.email || '—')}</td>
        <td class="subject-cell" title="${escapeHtml(subj)}">${escapeHtml(subjShort) || '<span style="color:var(--muted);">—</span>'}</td>
        <td>${senderBadge(p.sender || p.assigned_to)}</td>
        <td>${angleBadge(p.angle)}</td>
        <td class="mono">${formatDateFull(p.first_contact)}</td>
        <td><span class="days-pill ${daysClass}">${days}g</span></td>
        <td>${statusBadge(p.status)}</td>
        <td>${isSkip ? '<span style="color:var(--muted);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Escluso</span>' : escapeHtml(p.next_action || '—')}</td>
        <td class="mono ${dueClass}">${due ? `${dueLabel(due)} · ${formatDate(due)}` : '—'}</td>
      </tr>
    `;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => {
      const pid = tr.getAttribute('data-pid');
      const p = STATE.all.find(x => x.id === pid);
      if (p) openProspectModal(p);
    });
  });
  renderPagination(pag, state.currentPage, state.totalPages, 'changeProspectsPage', state.total, STATE.perPage);
}

// ---------- Vista per azienda ----------
function buildCompanies(filtered) {
  const companies = groupByCompany(filtered);
  for (const co of companies) {
    co.contacts_count = co.prospects.length;
    co.first_contact  = co.prospects.map(p => p.first_contact).filter(Boolean).sort()[0] || '';
    co.last_status    = co.prospects
      .slice()
      .sort((a, b) => (b.last_activity || '').localeCompare(a.last_activity || ''))[0]?.status || '—';
    co.angles         = [...new Set(co.prospects.map(p => p.angle).filter(Boolean))];
    co.replies_count  = co.prospects.filter(p =>
      ['in_conversation','call_booked','closed'].includes(p.status)
    ).length;
    // Per il sort "first_contact"
    co._sortFirst = co.first_contact;
  }
  return companies;
}

function renderCompanyView(filtered) {
  const wrap = document.getElementById('table-wrap');
  const pag  = document.getElementById('pagination');

  const companies = buildCompanies(filtered);
  if (!companies.length) {
    wrap.innerHTML = '<div class="empty">Nessuna azienda coi filtri attuali</div>';
    pag.innerHTML = '';
    return;
  }

  // Sort per company view
  const sortCfg = { col: STATE.sort.col, dir: STATE.sort.dir };
  // Mappa colonne company-view su getter sortabili
  const sortable = applySort(companies.map(c => ({
    ...c,
    brand: c.brand,
    first_contact: c.first_contact,
    days: daysSince(c.first_contact),
  })), sortCfg);
  const state = paginate(sortable, STATE.page, STATE.perPage);

  let html = `
    <table class="crm-table">
      <thead><tr>
        <th class="sortable ${STATE.sort.col === 'brand' ? 'sorted' : ''}" onclick="setSort('brand')">Azienda ${arrowFor('brand')}</th>
        <th>Dominio</th>
        <th class="sortable ${STATE.sort.col === 'contacts_count' ? 'sorted' : ''}" onclick="setSort('contacts_count')">Contatti ${arrowFor('contacts_count')}</th>
        <th>Angoli</th>
        <th class="sortable ${STATE.sort.col === 'first_contact' ? 'sorted' : ''}" onclick="setSort('first_contact')">Primo contatto ${arrowFor('first_contact')}</th>
        <th>Ultimo status</th>
        <th class="sortable ${STATE.sort.col === 'replies_count' ? 'sorted' : ''}" onclick="setSort('replies_count')">Risposte ${arrowFor('replies_count')}</th>
      </tr></thead>
      <tbody>
  `;
  for (const co of state.items) {
    const senderClasses = co.prospects.map(p => (p.sender || p.assigned_to || 'Manu').toLowerCase());
    const dominantSender = senderClasses[0] || 'manu';
    const anglesHtml = co.angles.map(a => angleBadge(a)).join(' ');
    const domainHtml = co.domain
      ? `<a href="https://${co.domain}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(co.domain)}</a>`
      : '<span style="color:var(--muted);">—</span>';
    html += `
      <tr class="${dominantSender}" data-brand="${escapeHtml(co.brand)}">
        <td class="brand-cell">🏢 ${escapeHtml(co.brand)}</td>
        <td class="mono">${domainHtml}</td>
        <td><strong>${co.contacts_count}</strong></td>
        <td>${anglesHtml || '—'}</td>
        <td class="mono">${formatDateFull(co.first_contact)}</td>
        <td>${statusBadge(co.last_status)}</td>
        <td>${co.replies_count > 0 ? `<strong style="color:var(--green);">${co.replies_count}</strong>` : '0'}</td>
      </tr>
    `;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => {
      const brand = tr.getAttribute('data-brand');
      const co = companies.find(x => x.brand === brand);
      if (co) openCompanyModal(co);
    });
  });
  renderPagination(pag, state.currentPage, state.totalPages, 'changeProspectsPage', state.total, STATE.perPage);
}

function render() {
  const filtered = applyFilters(STATE.all);

  // Update count
  document.getElementById('count').textContent =
    STATE.view === 'company'
      ? `${groupByCompany(filtered).length} aziende${filtered.length !== STATE.all.length ? ' (' + filtered.length + ' contatti)' : ''}`
      : `${filtered.length}${filtered.length !== STATE.all.length ? ' filtrati su ' + STATE.all.length : ''}`;

  // Active filters badge
  const af = activeFiltersCount();
  const badge = document.getElementById('f-active-badge');
  if (af > 0) {
    badge.style.display = 'inline-block';
    badge.textContent = `${af} filtro${af > 1 ? 'i' : ''} attiv${af > 1 ? 'i' : 'o'}`;
  } else {
    badge.style.display = 'none';
  }

  if (STATE.view === 'company') renderCompanyView(filtered);
  else renderContactView(filtered);
}

function bindFilters() {
  document.querySelectorAll('.chip[data-key]').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.getAttribute('data-key');
      const val = chip.getAttribute('data-value');
      STATE.filters[key] = val;
      const grp = chip.parentElement;
      grp.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      STATE.page = 1;
      render();
    });
  });
  document.getElementById('f-search').addEventListener('input', e => {
    STATE.filters.search = e.target.value.trim(); STATE.page = 1; render();
  });
  document.getElementById('f-status').addEventListener('change', e => {
    STATE.filters.status = e.target.value; STATE.page = 1; render();
  });
  document.getElementById('f-from').addEventListener('change', e => {
    STATE.filters.from = e.target.value || null; STATE.page = 1; render();
  });
  document.getElementById('f-to').addEventListener('change', e => {
    STATE.filters.to = e.target.value || null; STATE.page = 1; render();
  });
  document.getElementById('f-reset').addEventListener('click', () => {
    STATE.filters = { sender: 'all', angle: 'all', status: 'all', search: '', from: null, to: null };
    document.getElementById('f-search').value = '';
    document.getElementById('f-status').value = 'all';
    document.getElementById('f-from').value = '';
    document.getElementById('f-to').value = '';
    document.querySelectorAll('.chip[data-key]').forEach(c => {
      c.classList.toggle('active', c.getAttribute('data-value') === 'all');
    });
    STATE.page = 1;
    render();
  });
  document.getElementById('view-contact').addEventListener('click', () => {
    STATE.view = 'contact';
    document.getElementById('view-contact').classList.add('active');
    document.getElementById('view-company').classList.remove('active');
    STATE.page = 1; render();
  });
  document.getElementById('view-company').addEventListener('click', () => {
    STATE.view = 'company';
    document.getElementById('view-company').classList.add('active');
    document.getElementById('view-contact').classList.remove('active');
    STATE.page = 1; render();
  });
}

function applyQueryParams() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  if (status) {
    STATE.filters.status = status;
    document.getElementById('f-status').value = status;
  }
  const sender = params.get('sender');
  if (sender) STATE.filters.sender = sender;
  const angle = params.get('angle');
  if (angle) STATE.filters.angle = angle;

  // Sync chip UI
  for (const key of ['sender', 'angle']) {
    const val = STATE.filters[key];
    const grp = document.getElementById('f-' + key);
    if (grp) grp.querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('active', c.getAttribute('data-value') === val);
    });
  }
}

async function init() {
  document.getElementById('header-slot').innerHTML = buildHeader('prospects');
  try {
    const { all, meta } = await loadAllProspects();
    STATE.all = all;
    STATE.meta = meta;
    setTimestamp(meta && meta.last_updated);
    bindFilters();
    applyQueryParams();
    render();
  } catch (err) {
    showError(`Errore caricamento dati: ${err.message}`);
    setTimestamp(null);
  }
}
init();
</script>
</body>
</html>

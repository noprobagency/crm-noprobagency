<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NoProb · CRM · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="header-slot"></div>

<main>
  <!-- STATS -->
  <section>
    <div class="stats">
      <div class="stat"><div class="label">Contattati</div><div class="value" id="s-total">—</div></div>
      <div class="stat green"><div class="label">In conversazione</div><div class="value" id="s-conv">—</div></div>
      <div class="stat warning"><div class="label">Programmato</div><div class="value" id="s-due">—</div></div>
      <div class="stat blue"><div class="label">No reply</div><div class="value" id="s-noreply">—</div></div>
      <div class="stat danger"><div class="label">Bounce</div><div class="value" id="s-bounce">—</div></div>
      <div class="stat purple"><div class="label">Reply rate</div><div class="value" id="s-rate">—</div></div>
    </div>
  </section>

  <!-- 7-DAY ACTIVITY -->
  <section>
    <h2 class="section-title">Attività ultimi 7 giorni</h2>
    <div class="week-bar" id="week-bar"></div>
    <div class="week-legend">
      <span class="leg manu">Manu</span>
      <span class="leg dami">Dami</span>
      <span class="leg claude">Claude</span>
      <span class="leg antonio">Antonio</span>
    </div>
  </section>

  <!-- DATE RANGE FILTER -->
  <section>
    <div class="range-filter">
      <label for="range-from">Dal</label>
      <input type="date" id="range-from" />
      <label for="range-to">Al</label>
      <input type="date" id="range-to" />
      <button class="btn" id="range-apply">Applica</button>
      <button class="btn secondary" id="range-reset">Reset</button>
      <span id="range-active" style="display:none;" class="range-active-badge"></span>
    </div>
  </section>

  <!-- ROADMAP SOP con contatori -->
  <section>
    <h2 class="section-title">Sequenza Outreach (SOP)</h2>
    <div class="roadmap">
      <div class="roadmap-track" id="roadmap-track"></div>
      <div class="roadmap-legend">Tutto gestito automaticamente da Cowork · giorni lavorativi (no weekend, no festività italiane)</div>
    </div>
  </section>

  <!-- IN CONVERSAZIONE -->
  <section>
    <h2 class="section-title">In conversazione <span class="count" id="conv-count"></span></h2>
    <div class="conv-grid" id="conv-grid"></div>
    <div id="conv-see-all"></div>
  </section>
</main>

<script src="./js/shared.js"></script>
<script>
const STATE = { data: null, range: { from: null, to: null } };

function withinRange(dateStr) {
  if (!dateStr) return false;
  if (STATE.range.from && dateStr < STATE.range.from) return false;
  if (STATE.range.to   && dateStr > STATE.range.to)   return false;
  return true;
}
function rangeActive() { return !!(STATE.range.from || STATE.range.to); }

function applyRangeToProspects(items) {
  if (!rangeActive()) return items;
  return items.filter(p => withinRange(p.first_contact));
}

function renderStats() {
  const m = STATE.data.meta || {};
  let active  = STATE.data.active   || [];
  let noReply = STATE.data.no_reply || [];
  let bounced = STATE.data.bounced  || [];

  if (rangeActive()) {
    active  = applyRangeToProspects(active);
    noReply = applyRangeToProspects(noReply);
    bounced = applyRangeToProspects(bounced);
  }

  const inConv = active.filter(p =>
    p.status === 'in_conversation' || p.status === 'call_booked' || p.status === 'closed'
  ).length;
  const totalContacted = rangeActive()
    ? (active.length + noReply.length)
    : (m.total_contacted ?? (active.length + noReply.length));

  const dueSoon = [...active, ...noReply].filter(p => {
    const due = p.next_action_date;
    if (!due) return false;
    const d = daysUntil(due);
    return d != null && d >= 0 && d <= 2;
  }).length;

  document.getElementById('s-total').textContent   = totalContacted;
  document.getElementById('s-conv').textContent    = inConv;
  document.getElementById('s-due').textContent     = dueSoon;
  document.getElementById('s-noreply').textContent = noReply.length;
  document.getElementById('s-bounce').textContent  = bounced.length;
  const rate = totalContacted > 0 ? Math.round(inConv / totalContacted * 1000) / 10 : 0;
  document.getElementById('s-rate').textContent = totalContacted > 0 ? rate + '%' : '—';
}

function renderWeekBar() {
  const wrap = document.getElementById('week-bar');
  wrap.innerHTML = '';

  const flat = [...(STATE.data.active || []), ...(STATE.data.no_reply || [])];

  // 7 giorni terminanti su "oggi" o sull'estremo superiore del range
  let endIso = todayRomeIso();
  if (rangeActive() && STATE.range.to) endIso = STATE.range.to;
  const end = new Date(endIso + 'T00:00:00');
  const todayIso = todayRomeIso();

  for (let i = 6; i >= 0; i--) {
    const d = new Date(end); d.setDate(d.getDate() - i);
    const iso = d.toISOString().split('T')[0];

    // Prime email = first_contact == iso AND is_first_email !== false
    const onDayFirst = flat.filter(p => p.first_contact === iso && p.is_first_email !== false);
    const firstCounts = { Manu: 0, Dami: 0, Claude: 0, Antonio: 0 };
    for (const p of onDayFirst) {
      const s = p.sender || p.assigned_to || 'Manu';
      if (firstCounts[s] != null) firstCounts[s]++;
    }

    // Totale email = prime + tutti i followup_sent con date == iso
    const fuCounts = { Manu: 0, Dami: 0, Claude: 0, Antonio: 0 };
    for (const p of flat) {
      for (const f of (p.followups_sent || [])) {
        if (f.date === iso) {
          const s = f.sender || p.sender || 'Manu';
          if (fuCounts[s] != null) fuCounts[s]++;
        }
      }
    }
    const totalCounts = {};
    for (const k of ['Manu','Dami','Claude','Antonio']) {
      totalCounts[k] = (firstCounts[k] || 0) + (fuCounts[k] || 0);
    }
    const totalSum = Object.values(totalCounts).reduce((a,b)=>a+b,0);

    const isToday = iso === todayIso;
    const isEmpty = totalSum === 0;

    const dotsHtml = (counts) => ['Manu','Dami','Claude','Antonio']
      .filter(s => counts[s] > 0)
      .map(s => `<span class="dot ${s.toLowerCase()}">${counts[s]}</span>`).join('');

    const fuSum = Object.values(fuCounts).reduce((a,b)=>a+b,0);
    wrap.insertAdjacentHTML('beforeend', `
      <div class="day-card ${isToday ? 'today' : ''} ${isEmpty ? 'empty' : ''}">
        <div class="day-date">${dayCardLabel(iso)}</div>
        <div class="day-row"><span class="row-label">Prime</span><span class="row-num primary">${onDayFirst.length}</span></div>
        <div class="day-dots-row">${dotsHtml(firstCounts) || '<span style="color:var(--muted);font-size:10px;">—</span>'}</div>
        <div class="day-divider"></div>
        <div class="day-row"><span class="row-label">${fuSum} follow-up</span><span class="row-num secondary">= ${totalSum} tot</span></div>
        <div class="day-dots-row">${dotsHtml(fuCounts) || '<span style="color:var(--muted);font-size:10px;">—</span>'}</div>
      </div>
    `);
  }
}

function renderRoadmap() {
  const all = [...(STATE.data.active || []), ...(STATE.data.no_reply || [])];
  const bounced = STATE.data.bounced || [];

  const sentTypes = p => new Set((p.followups_sent || []).map(f => f.type));

  // G0: tutti tranne archived
  const g0 = all.filter(p => p.status !== 'archived').length;
  // FU 1: prospect senza follow_up_1 (e non in_conversation/closed/archived)
  const fu1 = all.filter(p =>
    !sentTypes(p).has('follow_up_1') &&
    !['in_conversation','call_booked','closed','archived'].includes(p.status)
  ).length;
  // FU 2: con follow_up_1 ma senza follow_up_2 (e non chiusi)
  const fu2 = all.filter(p => {
    const t = sentTypes(p);
    return t.has('follow_up_1') && !t.has('follow_up_2') &&
      !['in_conversation','call_booked','closed','archived'].includes(p.status);
  }).length;
  // FU 3: con follow_up_2 ma senza follow_up_3
  const fu3 = all.filter(p => {
    const t = sentTypes(p);
    return t.has('follow_up_2') && !t.has('follow_up_3') &&
      !['in_conversation','call_booked','closed','archived'].includes(p.status);
  }).length;

  const ooo = (STATE.data.no_reply || []).filter(p => p.status === 'autoresponse').length;
  const archCount = (STATE.data.no_reply || []).filter(p => p.status === 'archived').length;

  const link = (status) => `prospects.html?status=${encodeURIComponent(status)}`;

  document.getElementById('roadmap-track').innerHTML = `
    <div class="step">
      <div class="step-circle">G0</div>
      <div class="step-label">Prima email</div>
      <div class="step-sub">Outbound</div>
      <a class="step-counter" href="prospects.html">${g0}</a>
    </div>
    <div class="step">
      <div class="step-circle">G10</div>
      <div class="step-label">FU 1</div>
      <div class="step-sub">Rimando su</div>
      <a class="step-counter" href="${link('contacted')}">${fu1}</a>
    </div>
    <div class="step">
      <div class="step-circle">G25</div>
      <div class="step-label">FU 2</div>
      <div class="step-sub">Aggancio contestuale</div>
      <a class="step-counter" href="${link('follow_up_1_sent')}">${fu2}</a>
    </div>
    <div class="step">
      <div class="step-circle">G45</div>
      <div class="step-label">FU 3</div>
      <div class="step-sub">Ultima volta</div>
      <a class="step-counter" href="${link('follow_up_2_sent')}">${fu3}</a>
    </div>
    <div class="step stop">
      <div class="step-circle">OUT</div>
      <div class="step-label">Stop</div>
      <div class="step-sub">G46+</div>
      <div class="step-counter-group">
        <a class="step-counter bnc" href="bounced.html">Bounce ${bounced.length}</a>
        <a class="step-counter ooo" href="${link('autoresponse')}">OOO ${ooo}</a>
        <a class="step-counter arc" href="${link('archived')}">Arch ${archCount}</a>
      </div>
    </div>
  `;
}

function renderConversations() {
  const grid = document.getElementById('conv-grid');
  const seeAll = document.getElementById('conv-see-all');
  grid.innerHTML = ''; seeAll.innerHTML = '';

  let items = (STATE.data.active || []).filter(p =>
    p.status === 'in_conversation' || p.status === 'call_booked'
  );
  if (rangeActive()) items = applyRangeToProspects(items);
  document.getElementById('conv-count').textContent = items.length;

  if (items.length === 0) {
    grid.innerHTML = '<div class="empty">Nessuna conversazione attiva nel range</div>';
    return;
  }

  const visible = items.slice(0, 10);
  for (const p of visible) {
    const sender = (p.sender || p.assigned_to || 'Manu').toLowerCase();
    const due = p.next_action_date;
    const u = urgency(due);
    const out = p.last_outbound_by_antonio;
    const reply = p.last_reply_from_prospect;

    const card = document.createElement('div');
    card.className = `conv-card ${sender}`;
    card.innerHTML = `
      <div class="card-header">
        ${senderBadge(p.sender || p.assigned_to)}
        <span class="brand">${escapeHtml(p.brand || '—')}</span>
        ${angleBadge(p.angle)}
      </div>
      <div class="contact-line">
        ${escapeHtml(p.contact || '—')}${p.email ? ' · ' + escapeHtml(p.email) : ''}
      </div>
      ${out ? `
        <div class="panel outbound">
          <div class="panel-label">↗ Ultima email inviata</div>
          <div class="snippet">"${escapeHtml(out.snippet)}"</div>
          <div class="when">${formatDateFull(out.date)}</div>
        </div>
      ` : ''}
      ${reply ? `
        <div class="panel inbound">
          <div class="panel-label">↙ Ultima risposta</div>
          <div class="snippet">"${escapeHtml(reply.snippet)}"</div>
          <div class="when">${formatDateFull(reply.date)}</div>
        </div>
      ` : ''}
      <div class="reminder ${u !== 'normal' && u !== 'none' ? u : ''}">
        <span class="label">🔔 Reminder</span>
        ${due ? `${formatDateFull(due)} · ${dueLabel(due)}` : 'Nessuna scadenza'}<br>
        <span style="color:var(--muted);font-size:12px;">${escapeHtml(p.next_action || '')}</span>
      </div>
    `;
    card.addEventListener('click', () => openProspectModal(p));
    grid.appendChild(card);
  }
  if (items.length > 10) {
    seeAll.innerHTML = `<a href="prospects.html" class="see-all">Vedi tutti i ${items.length} →</a>`;
  }
}

function renderAll() {
  renderStats();
  renderWeekBar();
  renderRoadmap();
  renderConversations();
}

function bindRangeFilter() {
  document.getElementById('range-apply').addEventListener('click', () => {
    STATE.range.from = document.getElementById('range-from').value || null;
    STATE.range.to   = document.getElementById('range-to').value || null;
    updateRangeBadge();
    renderAll();
  });
  document.getElementById('range-reset').addEventListener('click', resetRange);

  // Imposta data minima dinamica
  const earliest = getEarliestContact(STATE.data);
  document.getElementById('range-from').setAttribute('min', earliest);
  document.getElementById('range-to').setAttribute('min', earliest);
  const todayIso = todayRomeIso();
  document.getElementById('range-from').setAttribute('max', todayIso);
  document.getElementById('range-to').setAttribute('max', todayIso);
}
function resetRange() {
  STATE.range = { from: null, to: null };
  document.getElementById('range-from').value = '';
  document.getElementById('range-to').value = '';
  updateRangeBadge();
  renderAll();
}
window.resetRange = resetRange;

function updateRangeBadge() {
  const b = document.getElementById('range-active');
  if (!rangeActive()) { b.style.display = 'none'; return; }
  const f = STATE.range.from ? formatDate(STATE.range.from) : '…';
  const t = STATE.range.to   ? formatDate(STATE.range.to)   : '…';
  b.innerHTML = `Filtro: ${f} – ${t} <a href="#" onclick="resetRange();return false;">×</a>`;
  b.style.display = 'inline-block';
}

async function init() {
  document.getElementById('header-slot').innerHTML = buildHeader('dashboard');
  try {
    STATE.data = await loadProspects();
    setTimestamp(STATE.data.meta && STATE.data.meta.last_updated);
    bindRangeFilter();
    renderAll();
  } catch (err) {
    showError(`Errore caricamento dati: ${err.message}`);
    setTimestamp(null);
  }
}
init();
</script>
</body>
</html>
